name: HACS Action

on:
  push:
  pull_request:
  schedule:
    - cron: "0 0 * * *"

# Validation only reads the repository.
permissions:
  contents: read

jobs:
  hacs:
    name: HACS Action
    runs-on: "ubuntu-latest"
    steps:
      - name: HACS Action
        uses: "hacs/action@main"
        with:
          category: "integration"
